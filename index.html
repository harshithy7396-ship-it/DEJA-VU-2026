<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Déjà vu – Technical Event</title>
    <meta name="description" content="A technical team competition featuring quiz, coding and bidding challenges." />
    <meta property="og:title" content="Déjà vu – Technical Event" />
    <meta property="og:description" content="A technical team competition featuring quiz, coding and bidding challenges." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Light mode is default. Only enable dark if explicitly saved as 'dark'
      (function() {
        try {
          var saved = localStorage.getItem('dejavu_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-neutral-50 text-neutral-900 dark:bg-[#090d16] dark:text-neutral-100 antialiased selection:bg-amber-400 selection:text-neutral-950 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
